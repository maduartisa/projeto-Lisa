services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: lisa_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.lightsail}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisa_app -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - platform-db:/var/lib/postgresql/data

  api:
    build:
      context: ./application
    restart: unless-stopped
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn commercial_platform.asgi:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://lisa_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.lightsail}@db:5432/platform
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.lightsail}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    expose:
      - "8000"

  web:
    build:
      context: ./application/web
      args:
        API_SERVER_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/lightsail/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  platform-db:
  caddy-data:
  caddy-config:
